<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23152019'/%3E%3Ccircle cx='22' cy='26' r='9' fill='%23E2464C'/%3E%3Ccircle cx='42' cy='26' r='9' fill='%23E5AE07'/%3E%3Crect x='12' y='38' width='40' height='10' rx='5' fill='%232E72DE'/%3E%3C/svg%3E">
<title>까나페 대회 진행판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap">
<style>
/* Layout: 위쪽 단계 레일 + 한 번에 한 장면. 조는 색깔 '주문 티켓'(절취선), 시간·점수는 크게.
   진행 도구는 장면 아래 점선 구역에 모으고 발표 모드에서 숨김 */
:root{
  --bg:#F1F5F2;--surface:#FFFFFF;--sunk:#E5ECE7;--ink:#152019;--muted:#55625B;--line:#D2DCD5;--scrim:rgba(12,18,14,.5);
  --btn:#152019;--btn-ink:#FFFFFF;--focus:#2F74E0;
  --good:#1D8655;--warn:#B76A00;--bad:#CC383E;--on-bad:#FFFFFF;
  --good-soft:#DFF2E7;--warn-soft:#FBEED6;--bad-soft:#FBE3E3;
  --t1:#E2464C;--t2:#DD6A1A;--t3:#E5AE07;--t4:#2A9A63;--t5:#2E72DE;--t6:#8954E3;
  --t1s:#FCE6E6;--t2s:#FDEBDD;--t3s:#FCF2CF;--t4s:#DEF1E6;--t5s:#E0EAFB;--t6s:#EDE4FB;
  --on1:#FFFFFF;--on2:#FFFFFF;--on3:#2A2000;--on4:#FFFFFF;--on5:#FFFFFF;--on6:#FFFFFF;
  --qr-bg:#FFFFFF;--qr-fg:#000000;
  --shadow:0 1px 0 rgba(21,32,25,.05),0 12px 26px -16px rgba(21,32,25,.4);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Sans KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311;--surface:#171E1A;--sunk:#202923;--ink:#E9F0EB;--muted:#9CA9A1;--line:#2C3631;--scrim:rgba(0,0,0,.6);
  --btn:#E9F0EB;--btn-ink:#0E1311;--focus:#7DA8F5;
  --good:#4CC28A;--warn:#E6A43C;--bad:#F06A6E;
  --good-soft:#14301F;--warn-soft:#33270E;--bad-soft:#3A1B1D;
  --t1s:#3A1D1F;--t2s:#3A2414;--t3s:#372E0F;--t4s:#133024;--t5s:#152843;--t6s:#28193E;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 30px -18px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311;--surface:#171E1A;--sunk:#202923;--ink:#E9F0EB;--muted:#9CA9A1;--line:#2C3631;--scrim:rgba(0,0,0,.6);
  --btn:#E9F0EB;--btn-ink:#0E1311;--focus:#7DA8F5;
  --good:#4CC28A;--warn:#E6A43C;--bad:#F06A6E;
  --good-soft:#14301F;--warn-soft:#33270E;--bad-soft:#3A1B1D;
  --t1s:#3A1D1F;--t2s:#3A2414;--t3s:#372E0F;--t4s:#133024;--t5s:#152843;--t6s:#28193E;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 14px 30px -18px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(15px,.5vw + 10px,21px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,3.4vw,3.2rem);line-height:1.12;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,2vw,1.8rem);line-height:1.2}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{display:block;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:.84rem;color:var(--muted)}
.bad-text{color:var(--bad);font-weight:700}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:1rem;min-width:0}
.t1{--tc:var(--t1);--ts:var(--t1s);--on:var(--on1)}.t2{--tc:var(--t2);--ts:var(--t2s);--on:var(--on2)}
.t3{--tc:var(--t3);--ts:var(--t3s);--on:var(--on3)}.t4{--tc:var(--t4);--ts:var(--t4s);--on:var(--on4)}
.t5{--tc:var(--t5);--ts:var(--t5s);--on:var(--on5)}.t6{--tc:var(--t6);--ts:var(--t6s);--on:var(--on6)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:.6rem 1.2rem;flex-wrap:wrap;padding-block:.55rem}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;max-width:16rem}
.brand b{font-family:var(--display);font-weight:400;font-size:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.08em}
.rail{display:flex;flex-wrap:wrap;gap:.3rem;flex:1 1 28rem;min-width:0}
.rail button{display:inline-flex;align-items:center;gap:.35rem;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.25rem .7rem .25rem .3rem;font-size:.84rem;font-weight:700;cursor:pointer}
.rail button i{font-style:normal;display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--sunk);font-size:.8em}
.rail button[aria-current="step"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rail button[aria-current="step"] i{background:var(--btn-ink);color:var(--btn)}
@media (max-width:1560px){.rail button:not([aria-current="step"]) span{display:none}.rail button:not([aria-current="step"]){padding-right:.3rem}}
@media (max-width:760px){.rail button span{display:none}.rail button{padding-right:.3rem}.rail button[aria-current="step"] span{display:inline}.rail button[aria-current="step"]{padding-right:.7rem}}
.tools{display:flex;align-items:center;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.mini-timer{display:inline-flex;align-items:center;padding:.2rem .7rem;border-radius:999px;background:var(--sunk);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-timer.idle{opacity:.7}.mini-timer.warn{background:var(--warn-soft);color:var(--warn)}.mini-timer.done{background:var(--bad-soft);color:var(--bad)}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;color:var(--muted);font-weight:700;white-space:nowrap}
.status::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
.status.live::before{background:var(--good)}.status.local::before{background:var(--warn)}.status.ro::before{background:var(--bad)}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.3rem .6rem;font-weight:700;cursor:pointer;font-size:.82rem;white-space:nowrap}
.linkish{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.84rem}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;background:var(--btn);color:var(--btn-ink);border:1.5px solid var(--btn);border-radius:12px;padding:.6rem 1.05rem;cursor:pointer;line-height:1.2;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.35rem .7rem;font-size:.85rem;border-radius:10px}
.btn.big{font-size:1.2rem;padding:.95rem 1.6rem;border-radius:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-size:1rem;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical;min-height:3.4rem}
.field{display:flex;flex-direction:column;gap:.25rem;font-size:.84rem;font-weight:700;color:var(--muted);border:0;padding:0;margin:0;min-width:0}
.field input,.field select,.field textarea{color:var(--ink);font-weight:400}
.tag{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;background:var(--sunk);padding:.12rem .55rem;font-size:.78rem;font-weight:700}
.tteam{background:var(--ts)}

/* page */
main{padding-block:1.3rem 2.5rem}
.stage{display:flex;flex-direction:column;gap:1.3rem;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem 1.5rem}
.head p{margin-top:.35rem;color:var(--muted);font-size:1.05rem}
.banner{border-radius:12px;padding:.6rem .9rem;font-weight:600;font-size:.9rem;background:var(--warn-soft);border:1px solid var(--line);margin-bottom:1rem}
.banner.bad{background:var(--bad-soft)}
body.present .banner-wrap{display:none}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:2.4rem 1.4rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.4rem}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--ink)}
.panel{margin-top:2.2rem;padding-top:1.1rem;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
body.present .op,body.readonly .op{display:none!important}
body.present .optool{display:none!important}

/* register */
.count-line{display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap}
.big-num{font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,8vw,6.5rem);line-height:.9}
.name-wall{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9rem),1fr));gap:.5rem}
.chip{display:flex;align-items:center;gap:.35rem;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.38rem .45rem .38rem .85rem;font-weight:700;font-size:1.05rem}
.chip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--muted);font-weight:700;font-size:.72rem;white-space:nowrap}
.chip small.tteam{color:var(--ink);border-radius:999px;padding:0 .4rem}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:.1rem .35rem;border-radius:50%}
.chip.fresh{border-color:var(--t5);animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
.chip.sample{border-style:dashed}
.tchips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.tchips .chip{font-size:.92rem}
.alist{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.25rem;font-size:.92rem}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* team tickets */
.tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:1000px){.tickets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.tickets{grid-template-columns:1fr}}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.ticket>header{display:flex;align-items:center;gap:.7rem;background:var(--tc);color:var(--on);padding:.55rem 1rem;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.ticket .tno{font-family:var(--display);font-size:2rem;line-height:1;white-space:nowrap}
.ticket .tmeta{display:flex;flex-direction:column;line-height:1.2;font-size:.84rem;font-weight:700;min-width:0}
.ticket .tmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .tcount{margin-left:auto;font-family:var(--display);font-size:1.35rem;white-space:nowrap}
.ticket .cname{padding:.6rem 1rem 0;font-family:var(--display);font-size:1.2rem;overflow-wrap:anywhere}
.perf{position:relative;margin:.65rem 1rem 0;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:calc(-1rem - 9px)}.perf::after{right:calc(-1rem - 9px)}
.members{list-style:none;margin:0;padding:.7rem 1rem 1rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.2rem .9rem;font-size:1.05rem;font-weight:700}
.members li{min-width:0}
.members.big{font-size:1.3rem;gap:.35rem 1rem}
.mem{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.mem small{color:var(--muted);font-size:.7rem;margin-left:.3rem}
.mem.sel{color:var(--bad);text-decoration:underline;text-underline-offset:3px}
body.present .mem,body.readonly .mem{cursor:default}
.move-here{margin:0 1rem 1rem;align-self:flex-start}

/* timer */
.timer-card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:1.1rem 1.4rem 1.3rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;box-shadow:var(--shadow);min-width:0}
.timer-card .tlabel{font-weight:700;color:var(--muted);letter-spacing:.04em}
.timer-digits{font-family:var(--display);font-size:clamp(4.6rem,14vw,12rem);line-height:.95;display:flex;justify-content:center}
.timer-digits .d{display:inline-block;width:.62em;text-align:center}
.timer-digits .c{display:inline-block;width:.3em;text-align:center}
.timer-card.warn .timer-digits{color:var(--warn)}
.timer-card.done .timer-digits{color:var(--bad);animation:blink 1s steps(2) infinite}
.timer-bar{width:100%;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.timer-bar i{display:block;height:100%;width:0;background:var(--btn);transition:width .2s linear}
.timer-card.warn .timer-bar i{background:var(--warn)}
body.flash .timer-card{box-shadow:0 0 0 6px var(--bad)}
@keyframes blink{50%{opacity:.35}}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.3rem;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.todo,.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.65rem}
.todo li{display:flex;gap:.6rem;align-items:center;font-size:1.15rem;font-weight:700}
.todo li::before{content:"";width:1.05rem;height:1.05rem;border:2px solid var(--ink);border-radius:5px;flex:none}
.rules{counter-reset:r}
.rules li{counter-increment:r;display:flex;gap:.8rem;align-items:baseline;font-size:1.15rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.75rem 1rem}
.rules li::before{content:counter(r);font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--muted)}

/* menu board + draft */
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:700px){.menu{grid-template-columns:1fr}}
.menu section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;min-width:0}
.menu h3{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-family:var(--display);font-weight:400;font-size:1.35rem}
.menu h3 small{font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:700}
.menu ul{list-style:none;margin:.45rem 0 0;padding:0}
.menu li{display:flex;justify-content:space-between;gap:.5rem;padding:.28rem 0;border-bottom:1px dotted var(--line);font-weight:600}
.menu li .sets{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.menu li.limited .sets{color:var(--warn);font-weight:700}
.menu li.out{color:var(--muted);text-decoration:line-through}
.rps-teams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.6rem}
@media (max-width:720px){.rps-teams{grid-template-columns:repeat(3,minmax(0,1fr))}}
.team-btn{background:var(--tc);color:var(--on);border:0;border-radius:var(--r);padding:1rem .6rem;font-family:var(--display);font-size:1.8rem;cursor:pointer;min-width:0}
.team-btn:disabled{opacity:.22;cursor:default}
.team-btn small{font-family:var(--body);font-size:.8rem;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rps-order{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem}
.rps-order li{background:var(--ts);border:1.5px solid var(--tc);border-radius:999px;padding:.3rem .85rem;font-weight:700;font-size:1.05rem}
.now{display:flex;align-items:center;justify-content:space-between;gap:.8rem 1.4rem;flex-wrap:wrap;background:var(--tc,var(--btn));color:var(--on,var(--btn-ink));border-radius:calc(var(--r) + 6px);padding:1rem 1.4rem}
.now .eyebrow{color:inherit;opacity:.85}
.now .who{font-family:var(--display);font-size:clamp(2.3rem,5vw,3.8rem);line-height:1}
.now .what{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.4rem)}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:.6rem}
.ing{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:.75rem .9rem;font-weight:700;font-size:1.08rem;cursor:pointer;text-align:left;min-width:0}
.ing:hover:not(:disabled){border-color:var(--btn)}
.ing .left{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted);white-space:nowrap}
.ing:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
body.present .ing,body.readonly .ing{pointer-events:none}
.scroll-x{overflow-x:auto}
.dtable{border-collapse:separate;border-spacing:.35rem;min-width:46rem;width:100%}
.dtable th{font-size:.78rem;color:var(--muted);text-align:left;font-weight:700;white-space:nowrap;padding:0 .2rem}
.dtable td{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.35rem .5rem;font-size:.86rem;vertical-align:top;min-width:6.5rem}
.dtable td .tm{display:block;font-weight:800;font-size:.8rem}
.dtable td.cur{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc)}
.dtable td.done{background:var(--ts);border-color:transparent}

/* making */
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:1000px){.orders{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.orders{grid-template-columns:1fr}}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.order>header{background:var(--tc);color:var(--on);display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.45rem 1rem;font-family:var(--display);font-size:1.5rem}
.order>header small{font-family:var(--body);font-size:.85rem;font-weight:700}
.order .tgt{padding:.6rem 1rem 0;display:flex;align-items:baseline;gap:.35rem;font-weight:700}
.order .tgt b{font-family:var(--display);font-weight:400;font-size:3.3rem;line-height:1}
.order .per{padding:0 1rem;color:var(--muted);font-size:.85rem}
.plates{list-style:none;margin:0;padding:.7rem 1rem .9rem;display:flex;flex-wrap:wrap;gap:.35rem}

<body>
<div id="app"></div>
<div id="drawer" class="drawer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true" hidden></canvas>
<script>
(function () {
'use strict';
/*<logic>*/
const TEAMS = [1, 2, 3, 4, 5, 6];
const TEAM_COUNT = 6;
const COLOR_NAMES = {1: '빨강', 2: '주황', 3: '노랑', 4: '초록', 5: '파랑', 6: '보라'};
const CATS = {base: '베이스', topping: '토핑', seasoning: '시즈닝'};
const CAT_KEYS = ['base', 'topping', 'seasoning'];
const DRAFT_MODES = {
  '121': ['base', 'topping', 'topping', 'seasoning'],
  '132': ['base', 'topping', 'topping', 'topping', 'seasoning', 'seasoning']
};
const POINTS = [5, 3, 1];
const CODE_PREFIX = 'KC1-';

function shuffle(list, rng) {
  const r = rng || Math.random;
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function gradeKey(g) { const n = parseInt(g, 10); return Number.isFinite(n) ? n : 99; }

// Deal kids round-robin into a random team order. Sorting a shuffled list by grade
// (stable sort) keeps the random order inside each grade and spreads grades evenly.
function formTeams(kids, teachers, opts) {
  const o = opts || {};
  const r = o.rng || Math.random;
  let ordered = shuffle(kids, r);
  if (o.balanceGrades !== false) ordered = ordered.sort((a, b) => gradeKey(a.grade) - gradeKey(b.grade));
  const teamOrder = shuffle(TEAMS, r);
  const assign = {};
  ordered.forEach((k, i) => { assign[k.id] = teamOrder[i % TEAM_COUNT]; });
  const tTeams = shuffle(TEAMS, r);
  const teacherAssign = {};
  shuffle(teachers, r).forEach((t, i) => { teacherAssign[t.id] = tTeams[i % TEAM_COUNT]; });
  return {assign: assign, teacherAssign: teacherAssign};
}
function sizeSummary(n) {
  if (!n) return '';
  const base = Math.floor(n / TEAM_COUNT), extra = n % TEAM_COUNT;
  if (!base) return n + '명이라 빈 조가 생겨요';
  if (!extra) return base + '명 조 6개';
  return (base + 1) + '명 조 ' + extra + '개 · ' + base + '명 조 ' + (TEAM_COUNT - extra) + '개';
}
function countBy(assign, ids) {
  const s = {};
  TEAMS.forEach(t => { s[t] = 0; });
  ids.forEach(id => { const t = Number(assign && assign[id]); if (s[t] !== undefined) s[t] += 1; });
  return s;
}
function smallestTeam(sizes, rng) {
  const r = rng || Math.random;
  const min = Math.min.apply(null, TEAMS.map(t => sizes[t] || 0));
  const c = TEAMS.filter(t => (sizes[t] || 0) === min);
  return c[Math.floor(r() * c.length)];
}
// Snake order: round 1 goes ①→⑥, round 2 goes ⑥→①, and so on.
function draftSequence(rps, mode) {
  const cats = DRAFT_MODES[mode] || DRAFT_MODES['121'];
  if (!Array.isArray(rps) || rps.length !== TEAM_COUNT) return [];
  const seq = [];
  cats.forEach((cat, ri) => {
    const order = ri % 2 === 0 ? rps : rps.slice().reverse();
    order.forEach(team => { seq.push({round: ri + 1, cat: cat, team: Number(team), slot: rps.indexOf(team) + 1}); });
  });
  return seq;
}
function pickCounts(mode) {
  const c = {base: 0, topping: 0, seasoning: 0};
  (DRAFT_MODES[mode] || DRAFT_MODES['121']).forEach(k => { c[k] += 1; });
  return c;
}
function catOrdinal(mode, round) {
  const cats = DRAFT_MODES[mode] || DRAFT_MODES['121'];
  const cat = cats[round - 1];
  if (!cat) return '';
  if (cats.filter(c => c === cat).length < 2) return '';
  let n = 0;
  for (let i = 0; i < round; i++) if (cats[i] === cat) n += 1;
  return n + '번째';
}
function ingKey(cat, name) { return cat + '|' + name; }
function remainingSets(ingredients, picks) {
  const used = {};
  (picks || []).forEach(p => { if (p && p.name) { const k = ingKey(p.cat, p.name); used[k] = (used[k] || 0) + 1; } });
  const out = {};
  CAT_KEYS.forEach(cat => {
    ((ingredients && ingredients[cat]) || []).forEach(it => {
      const k = ingKey(cat, it.name);
      out[k] = Math.max(0, (Number(it.sets) || 0) - (used[k] || 0));
    });
  });
  return out;
}
function teamPicks(picks, team) { return (picks || []).filter(p => p && Number(p.team) === Number(team) && p.name); }
function computeTargets(sizes) {
  const total = TEAMS.reduce((s, t) => s + (sizes[t] || 0), 0);
  return TEAMS.map(t => ({
    team: t, size: sizes[t] || 0, target: total - (sizes[t] || 0),
    plates: TEAMS.filter(o => o !== t).map(o => ({to: o, count: sizes[o] || 0}))
  }));
}
function validBallot(b, voter) {
  if (!b || !Array.isArray(b.ranks) || b.ranks.length !== 3) return false;
  const r = b.ranks.map(Number);
  const v = Number(voter);
  if (r.some(t => TEAMS.indexOf(t) < 0 || t === v)) return false;
  return new Set(r).size === 3;
}
// 5·3·1 points; ties broken by number of 1st-place votes, then 2nd-place votes; otherwise shared rank.
function computeResults(votes) {
  const acc = {};
  TEAMS.forEach(t => { acc[t] = {team: t, score: 0, firsts: 0, seconds: 0, thirds: 0, comments: [], rank: 0}; });
  TEAMS.forEach(voter => {
    const v = votes && votes[voter];
    if (!validBallot(v, voter)) return;
    const r = v.ranks.map(Number);
    r.forEach((t, i) => {
      acc[t].score += POINTS[i];
      if (i === 0) acc[t].firsts += 1; else if (i === 1) acc[t].seconds += 1; else acc[t].thirds += 1;
    });
    const cm = v.comments || {};
    Object.keys(cm).forEach(k => {
      const t = Number(k);
      const text = String(cm[k] == null ? '' : cm[k]).trim().slice(0, 80);
      if (acc[t] && t !== voter && text) acc[t].comments.push({from: voter, text: text, place: r.indexOf(t) + 1});
    });
  });
  const arr = TEAMS.map(t => acc[t]).sort((a, b) => b.score - a.score || b.firsts - a.firsts || b.seconds - a.seconds || a.team - b.team);
  arr.forEach((s, i) => {
    const p = arr[i - 1];
    s.rank = (p && p.score === s.score && p.firsts === s.firsts && p.seconds === s.seconds) ? p.rank : i + 1;
  });
  arr.forEach(s => { s.comments.sort((a, b) => (a.place || 9) - (b.place || 9) || a.from - b.from); });
  return arr;
}
// Reveal from the lowest Top3 rank upward; tied teams are revealed together.
function revealGroups(results) {
  const ranks = [];
  results.forEach(r => { if (r.rank <= 3 && r.score > 0 && ranks.indexOf(r.rank) < 0) ranks.push(r.rank); });
  ranks.sort((a, b) => b - a);
  return ranks.map(rank => ({rank: rank, teams: results.filter(r => r.rank === rank && r.score > 0)}));
}
function toB64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(s) {
  let t = s.replace(/-/g, '+').replace(/_/g, '/');
  while (t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encodeBallot(voter, ranks, comments, canape) {
  const c = {};
  Object.keys(comments || {}).forEach(k => { const t = String(comments[k] || '').trim(); if (t) c[k] = t.slice(0, 80); });
  const o = {v: 1, t: Number(voter), r: ranks.map(Number), c: c};
  const n = String(canape || '').trim();
  if (n) o.n = n.slice(0, 24);
  return CODE_PREFIX + toB64url(JSON.stringify(o));
}
function decodeBallot(code) {
  const m = String(code || '').replace(/\s+/g, '').match(/KC1-([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const o = JSON.parse(fromB64url(m[1]));
    const voter = Number(o.t);
    const ranks = (Array.isArray(o.r) ? o.r : []).map(Number);
    const comments = {};
    Object.keys(o.c || {}).forEach(k => { const t = Number(k); if (TEAMS.indexOf(t) >= 0 && t !== voter) comments[t] = String(o.c[k]).slice(0, 80); });
    const ballot = {ranks: ranks, comments: comments};
    if (TEAMS.indexOf(voter) < 0 || !validBallot(ballot, voter)) return null;
    return {voter: voter, ballot: ballot, canape: o.n ? String(o.n).slice(0, 24) : ''};
  } catch (e) { return null; }
}
function parseIngredients(text) {
  const seen = {};
  return String(text || '').split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)[\s,×*]*(\d+)\s*(세트)?$/);
    if (m && m[1].trim()) return {name: m[1].trim().slice(0, 30), sets: Math.max(0, Math.min(20, parseInt(m[2], 10)))};
    return {name: l.slice(0, 30), sets: 1};
  }).filter(it => { if (seen[it.name]) return false; seen[it.name] = true; return true; }).slice(0, 30);
}
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
/*</logic>*/

/* ---------- config ---------- */
const TIMERS = {
  plan: {label: '기획 회의', ms: 5 * 60000},
  make: {label: '까나페 제작', ms: 10 * 60000},
  taste: {label: '시식', ms: 5 * 60000},
  vote: {label: '투표', ms: 3 * 60000}
};
const STEPS = [
  {key: 'register', label: '등록'}, {key: 'teams', label: '조 편성'}, {key: 'plan', label: '기획 회의', timer: 'plan'},
  {key: 'draft', label: '재료 수령'}, {key: 'make', label: '제작', timer: 'make'}, {key: 'taste', label: '시식', timer: 'taste'},
  {key: 'vote', label: '투표', timer: 'vote'}, {key: 'reveal', label: '발표'}, {key: 'winners', label: 'Top3 명단'}
];
const CIRC = ['①', '②', '③', '④', '⑤', '⑥'];
const DEFAULT_CONFIG = {
  eventName: '소년부 까나페 챌린지',
  voteUrl: '',
  draftMode: '121',
  ingredients: {
    base: [{name: '크래커 (리츠류)', sets: 3}, {name: '바게트 슬라이스', sets: 2}, {name: '식빵 모양컷', sets: 2}, {name: '오이 슬라이스', sets: 1}],
    topping: [{name: '크림치즈', sets: 2}, {name: '참치마요', sets: 2}, {name: '슬라이스 햄', sets: 2}, {name: '큐브 치즈', sets: 2},
      {name: '방울토마토', sets: 2}, {name: '딸기잼', sets: 1}, {name: '게맛살', sets: 1}, {name: '샤인머스캣', sets: 1},
      {name: '귤', sets: 1}, {name: '블루베리', sets: 1}, {name: '미니 마시멜로', sets: 1}],
    seasoning: [{name: '꿀', sets: 1}, {name: '초코시럽', sets: 1}, {name: '연유', sets: 1}, {name: '마요네즈', sets: 1},
      {name: '케첩', sets: 1}, {name: '파슬리 가루', sets: 1}, {name: '슈가파우더', sets: 1}, {name: '컬러 스프링클', sets: 1}]
  }
};

/* ---------- in-memory stand-in when the shared store is not available ---------- */
function makeMemDB(persistKey) {

  }
  let saveT = null;
  const saveNow = () => { if (!persistKey) return; const o = {}; docs.forEach((v, k) => { o[k] = v; }); ls.set(persistKey, o); };
  const persist = () => { if (!persistKey) return; clearTimeout(saveT); saveT = setTimeout(saveNow, 150); };

    (colL.get(colOf(p)) || new Set()).forEach(f => f(snapCol(colOf(p))));
  }, 0);

    id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async d => { docs.set(p, clone(d)); persist(); notify(p); },
    update: async d => { if (!docs.has(p)) throw {code: 'invalid_argument', message: 'missing document'}; docs.set(p, deepMerge(docs.get(p), d)); persist(); notify(p); },
    delete: async () => { docs.delete(p); persist(); notify(p); },
    onSnapshot: next => { if (!docL.has(p)) docL.set(p, new Set()); docL.get(p).add(next); setTimeout(() => next(snapDoc(p)), 0); return () => docL.get(p).delete(next); }
  });

    doc: docRef,
    collection: cp => ({
      path: cp,
      doc: id => docRef(cp + '/' + (id || Math.random().toString(36).slice(2, 10))),
      onSnapshot: next => { if (!colL.has(cp)) colL.set(cp, new Set()); colL.get(cp).add(next); setTimeout(() => next(snapCol(cp)), 0); return () => colL.get(cp).delete(next); }
    })

}

const chains = {};

}

        else {
          try { await ref.update(data); } catch (e) {
            if (e && e.code === 'invalid_argument' && !serverHas(path)) await ref.set(data); else throw e;
          }

}

}

/* ---------- timers + sound ---------- */
function timerRemaining(key) {

  const preset = TIMERS[key] ? TIMERS[key].ms : 0;
  if (t.key !== key) return {ms: preset, total: preset, active: false, running: false};
  const total = Number(t.durationMs) || preset;
  const ms = t.running ? Math.max(0, (Number(t.endsAt) || 0) - Date.now()) : Math.max(0, t.remainingMs == null ? total : Number(t.remainingMs));
  return {ms: ms, total: total, active: true, running: !!t.running};
}

  const t = S.state.timer || {}, now = Date.now(), preset = TIMERS[key].ms;
  const resume = t.key === key && !t.running && Number(t.remainingMs) > 0;
  const rem = resume ? Number(t.remainingMs) : preset;
  writeState({timer: {key: key, durationMs: resume ? (Number(t.durationMs) || preset) : preset, endsAt: now + rem, remainingMs: rem, running: true}});
}

}
function timerReset(key) { const p = TIMERS[key].ms; writeState({timer: {key: key, durationMs: p, endsAt: null, remainingMs: p, running: false}}); }
function timerPlus(key) {
  const t = S.state.timer || {};
  if (t.key !== key) { const p = TIMERS[key].ms + 60000; writeState({timer: {key: key, durationMs: p, endsAt: null, remainingMs: p, running: false}}); return; }
  const dur = (Number(t.durationMs) || TIMERS[key].ms) + 60000;
  if (t.running) writeState({timer: Object.assign({}, t, {endsAt: Math.max(Date.now(), Number(t.endsAt) || 0) + 60000, durationMs: dur})});
  else writeState({timer: Object.assign({}, t, {remainingMs: (Number(t.remainingMs) || 0) + 60000, durationMs: dur})});
}
function timerToggleCurrent() {

  return true;
}
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}

  freqs.forEach(f => {
    const o = ctx.createOscillator(), g = ctx.createGain();

let lastSec = null, lastKey = null;
function sounds(t) {
  if (currentMode() !== 'operator' || !ui.sound || !t.running || !t.key) { lastSec = null; lastKey = t.key || null; return; }
  const sec = Math.ceil(Math.max(0, (Number(t.endsAt) || 0) - Date.now()) / 1000);
  if (lastKey === t.key && lastSec !== null && sec < lastSec) {
    if (lastSec > 60 && sec <= 60 && sec > 10) chime([660], 0.25);
    if (sec <= 10 && sec >= 1) chime([990], 0.07);

function updateTimers() {
  const t = S.state.timer || {};
  $$('[data-timer]').forEach(el => {
    const any = el.dataset.timer === '*';
    const key = any ? t.key : el.dataset.timer;
    if (!key || !TIMERS[key]) { if (any) el.hidden = true; return; }
    const r = timerRemaining(key);
    if (any) {
      el.hidden = false;
      const txt = TIMERS[key].label + ' ' + fmtClock(r.ms);
      if (el.textContent !== txt) el.textContent = txt;
      el.classList.toggle('idle', !r.running);
      el.classList.toggle('warn', r.ms > 0 && r.ms <= 60000);
      el.classList.toggle('done', r.running && r.ms === 0);
      return;
    }
    const html = digits(r.ms);
    if (el.dataset.last !== html) { el.innerHTML = html; el.dataset.last = html; }
    const card = el.closest('[data-timer-card]');
    if (card) {
      card.classList.toggle('running', r.running && r.ms > 0);
      card.classList.toggle('warn', r.active && r.ms > 0 && r.ms <= 60000);
      card.classList.toggle('done', r.active && r.running && r.ms === 0);

  });

    const r = timerRemaining(el.dataset.timerBar);

  }));
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.vy += 0.45 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    });
    if (now - t0 < 3400) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

/* ---------- standalone hosting (GitHub Pages) ----------
   The laptop keeps every record in its own browser. Teachers' phones reach it through two
   free public MQTT relays at once. Every message is encrypted with a key that exists only in
   the QR link (after #), so the relays and the web host never see names or votes. */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOPIC_ROOT = 'kc-canape/v1/';
const BUS = {ident: null, clients: [], startedAt: 0, onConnect: null};
const HOST = {acks: {}, pubT: null, lastBody: '', lastPubAt: 0, dupTab: false};
const PH = {lastStateAt: 0, sentAt: 0, offset: 0, acks: {}, pendingVote: null, pendingCanape: null, voted: [], noKey: false};
let cryptoKey = null;

function relayList() {
  try {
    const q = new URLSearchParams(location.search).get('relays');
    if (q) { const l = q.split(',').map(x => x.trim()).filter(x => /^wss?:\/\//.test(x)).slice(0, 3); if (l.length) return l; }
  } catch (e) { /* use defaults */ }
  return RELAYS;
}
function bytesToB64u(a) { let s = ''; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64uToBytes(s) { let t = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return Uint8Array.from(atob(t), c => c.charCodeAt(0)); }
function randToken(n) { return bytesToB64u(crypto.getRandomValues(new Uint8Array(n))); }
function hostIdentity() {
  let id = ls.get('kc-event', null);
  if (!id || !/^[A-Za-z0-9_-]{8,40}$/.test(id.e || '') || !/^[A-Za-z0-9_-]{20,64}$/.test(id.k || '')) { id = {e: randToken(9), k: randToken(16)}; ls.set('kc-event', id); }
  return id;
}
function phoneIdentity() {
  const m = location.hash.match(/^#vote\/([A-Za-z0-9_-]{8,40})\/([A-Za-z0-9_-]{20,64})$/);
  return m ? {e: m[1], k: m[2]} : null;
}
async function importKey(k) { return crypto.subtle.importKey('raw', b64uToBytes(k), 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function seal(o) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(o))));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv); out.set(ct, 12);
  return bytesToB64u(out);
}
async function unseal(text) {
  try {
    const b = b64uToBytes(text);
    if (b.length < 29) return null;
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, cryptoKey, b.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { return null; }
}
function loadScript(srcs) {
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= srcs.length) { res(false); return; }
      const s = document.createElement('script');
      s.src = srcs[i++];
      s.onload = () => res(true);
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
}
const topicOf = sub => TOPIC_ROOT + BUS.ident.e + '/' + sub;
function busUp() { return BUS.clients.filter(c => c.connected).length; }
function busStart(ident, subs, onMessage) {
  BUS.ident = ident; BUS.startedAt = Date.now();
  if (!window.mqtt || typeof window.mqtt.connect !== 'function') return;
  const prefix = TOPIC_ROOT + ident.e + '/';
  relayList().forEach(url => {
    let c;
    try { c = window.mqtt.connect(url, {clientId: 'kc_' + randToken(6), clean: true, connectTimeout: 8000, reconnectPeriod: 4000, keepalive: 30, protocolVersion: 4}); } catch (e) { return; }
    const entry = {url: url, client: c, connected: false};
    BUS.clients.push(entry);
    c.on('connect', () => {
      entry.connected = true;
      c.subscribe(subs.map(topicOf), {qos: 1});
      if (BUS.onConnect) BUS.onConnect(entry);
      scheduleRender();
    });
    const down = () => { if (entry.connected) { entry.connected = false; scheduleRender(); } };
    c.on('close', down); c.on('offline', down); c.on('error', () => {});
    c.on('message', (topic, payload, packet) => {
      const t = String(topic);
      if (t.indexOf(prefix) !== 0) return;
      onMessage(t.slice(prefix.length), payload ? payload.toString() : '', !!(packet && packet.retain));
    });
  });
}
function busPublish(sub, text, retain) {
  let sent = false;
  BUS.clients.forEach(en => {
    if (!en.connected) return;
    try { en.client.publish(topicOf(sub), text, {qos: 1, retain: !!retain}); sent = true; } catch (e) { /* relay dropped */ }
  });
  return sent;
}

/* host (진행 화면 on the laptop) */
function hostBody() {
  const kidsOut = {}, tOut = {};
  kids().forEach(k => { kidsOut[k.id] = {name: k.name, grade: k.grade, allergy: k.allergy}; });
  teachers().forEach(x => { tOut[x.id] = {name: x.name}; });
  return {
    v: 1, eventName: S.config.eventName, voting: {open: !!S.state.voting.open}, timer: S.state.timer || {},
    roster: {kids: kidsOut, teachers: tOut}, teams: {assign: S.teams.assign, teacherAssign: S.teams.teacherAssign, formedAt: S.teams.formedAt},
    canape: S.canape, voted: TEAMS.filter(t => validBallot(S.votes[t], t)), resetAt: Number(S.state.voteResetAt) || 0
  };
}
async function hostPublish(force) {
  if (IN_CLAUDE || currentMode() === 'vote' || !cryptoKey || !S.loaded || !busUp()) return;
  const body = JSON.stringify(hostBody());
  if (!force && body === HOST.lastBody && Date.now() - HOST.lastPubAt < 25000) return;
  HOST.lastBody = body; HOST.lastPubAt = Date.now();
  busPublish('state', await seal(Object.assign(JSON.parse(body), {sentAt: Date.now()})), true);
}
function scheduleHostPublish() {
  if (IN_CLAUDE || currentMode() === 'vote') return;
  clearTimeout(HOST.pubT);
  HOST.pubT = setTimeout(() => hostPublish(false), 400);
}
async function hostAck(t, info) {
  HOST.acks[t] = Object.assign({team: t, voteAt: 0, canapeAt: 0, rejected: '', rejectedAt: 0}, HOST.acks[t] || {}, info, {sentAt: Date.now()});
  busPublish('ack/t' + t, await seal(HOST.acks[t]), true);
}
async function hostOnMessage(sub, text) {
  const m = sub.match(/^(vote|canape)\/t([1-6])$/);
  if (!m || !text) return;
  if (!S.loaded) { setTimeout(() => hostOnMessage(sub, text), 300); return; }
  const t = Number(m[2]);
  const msg = await unseal(text);
  if (!msg || Number(msg.team) !== t) return;
  const at = Number(msg.at) || 0;
  if (at <= (Number(S.state.voteResetAt) || 0)) return;
  if (m[1] === 'canape') {
    if (at <= ((S.canapeAt || {})[t] || 0)) { hostAck(t, {canapeAt: at}); return; }
    (S.canapeAt = S.canapeAt || {})[t] = at;
    await write('canape/t' + t, 'set', {name: String(msg.name || '').trim().slice(0, 24), at: at});
    hostAck(t, {canapeAt: at});
    return;
  }
  const prev = S.votes[t];
  if (prev && Number(prev.at) >= at) { if (prev.source === 'phone') hostAck(t, {voteAt: Number(prev.at)}); return; }
  const comments = {};
  Object.keys(obj(msg.comments)).forEach(k => { const o = Number(k), v = String(msg.comments[k] || '').trim().slice(0, 80); if (TEAMS.indexOf(o) >= 0 && o !== t && v) comments[o] = v; });
  const ranks = arr(msg.ranks).map(Number).slice(0, 3);
  if (!validBallot({ranks: ranks}, t)) return;
  const closedAt = Number(S.state.voting.closedAt) || 0;
  if (!S.state.voting.open && !(closedAt && at <= closedAt)) { hostAck(t, {rejected: 'closed', rejectedAt: at}); return; }
  S.votes[t] = {ranks: ranks, comments: comments, source: 'phone', at: at};
  await write('votes/t' + t, 'set', {team: t, ranks: ranks, comments: comments, source: 'phone', at: at});
  const cn = String(msg.canape || '').trim().slice(0, 24);
  if (cn && at > ((S.canapeAt || {})[t] || 0)) { (S.canapeAt = S.canapeAt || {})[t] = at; await write('canape/t' + t, 'set', {name: cn, at: at}); }
  hostAck(t, {voteAt: at, rejected: '', rejectedAt: 0});
}
// Clear what the relays remember for this event (after a reset).
function hostClearRelay(withCanape) {
  HOST.acks = {};
  TEAMS.forEach(t => { busPublish('vote/t' + t, '', true); busPublish('ack/t' + t, '', true); if (withCanape) busPublish('canape/t' + t, '', true); });
}
function rotateIdentity() {
  hostClearRelay(true);
  busPublish('state', '', true);
  ls.set('kc-event', {e: randToken(9), k: randToken(16)});
  setTimeout(() => location.reload(), 600);
}

/* phone (선생님 화면) */
function phoneApply(msg, fresh) {
  if (fresh && Number(msg.sentAt)) PH.offset = Number(msg.sentAt) - Date.now();
  if (typeof msg.eventName === 'string' && msg.eventName.trim()) S.config.eventName = msg.eventName.slice(0, 30);
  const tm = Object.assign({}, obj(msg.timer));
  if (tm.running && tm.endsAt) tm.endsAt = Number(tm.endsAt) - PH.offset;
  S.state = Object.assign({}, S.state, {voting: obj(msg.voting), timer: tm});
  const ro = obj(msg.roster);
  S.roster = {kids: obj(ro.kids), teachers: obj(ro.teachers)};
  const tms = obj(msg.teams);
  S.teams = {assign: obj(tms.assign), teacherAssign: obj(tms.teacherAssign), formedAt: tms.formedAt || null, rolls: 0};
  const c = {};
  Object.keys(obj(msg.canape)).forEach(k => { const t = Number(k); if (TEAMS.indexOf(t) >= 0) c[t] = String(msg.canape[k]).slice(0, 24); });
  S.canape = c;
  PH.voted = arr(msg.voted).map(Number);
}
async function phoneOnMessage(sub, text, retained) {
  if (!text) return;
  const msg = await unseal(text);
  if (!msg) return;
  if (sub === 'state') {
    if (Number(msg.sentAt) < PH.sentAt) return;
    PH.sentAt = Number(msg.sentAt) || 0; PH.lastStateAt = Date.now();
    phoneApply(msg, !retained);
    S.loaded = true;
    scheduleRender();
    return;
  }
  const m = sub.match(/^ack\/t([1-6])$/);
  if (m) {
    const t = Number(m[1]);
    PH.acks[t] = msg;
    const pv = PH.pendingVote, pc = PH.pendingCanape;
    if (pv && pv.t === t && !pv.toasted) {
      if (Number(msg.voteAt) >= pv.at) { pv.toasted = true; toast('진행 화면이 투표를 받았어요'); }
      else if (msg.rejected === 'closed' && Number(msg.rejectedAt) === pv.at) { pv.toasted = true; toast('투표가 마감된 뒤라 반영되지 않았어요', 'bad'); }
    }
    if (pc && pc.t === t && !pc.toasted && Number(msg.canapeAt) >= pc.at) { pc.toasted = true; toast('까나페 이름이 저장됐어요'); }
    scheduleRender();
  }
}
async function phoneSend(kind, t, body) {
  const at = Date.now() + PH.offset;
  const ok = busPublish(kind + '/t' + t, await seal(Object.assign({team: t, at: at}, body)), true);
  if (ok) PH['pending' + (kind === 'vote' ? 'Vote' : 'Canape')] = {t: t, at: at, sentAt: Date.now()};
  return ok;
}
function phoneLinkReady() { return busUp() > 0 && PH.lastStateAt > 0; }

async function relayConnect() {
  const vote = currentMode() === 'vote';
  const ident = vote ? phoneIdentity() : hostIdentity();
  if (vote) {
    dbMode = 'relay';
    if (!ident) { PH.noKey = true; ui.forceCode = true; S.loaded = true; scheduleRender(); return; }
  } else {
    db = makeMemDB('kc-db-v1');
    dbMode = 'device';
    subscribeAll();
    try {
      const ch = new BroadcastChannel('kc-host');
      ch.onmessage = e => { if (e.data === 'hello') ch.postMessage('here'); HOST.dupTab = true; scheduleRender(); };
      ch.postMessage('hello');
    } catch (e) { /* older browser */ }
  }
  try { cryptoKey = await importKey(ident.k); } catch (e) { cryptoKey = null; }
  if (!cryptoKey) { ui.forceCode = true; scheduleRender(); return; }
  await loadScript(['vendor/mqtt.min.js', 'https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js']);
  if (vote) busStart(ident, ['state', 'ack/+'], phoneOnMessage);
  else {
    BUS.onConnect = () => hostPublish(true);
    busStart(ident, ['vote/+', 'canape/+'], hostOnMessage);
    setInterval(() => hostPublish(false), 25000);
  }
  setTimeout(scheduleRender, 10500);
  scheduleRender();
}

let built = null, lastStageHtml = '', queued = false;

    case 'register': return stageRegister();
    case 'teams': return stageTeams();

  return STEPS[Math.max(0, Math.min(STEPS.length - 1, i + d))].key;
}
function setHash(h) { built = null; location.hash = h; scheduleRender(); }

document.addEventListener('click', e => {
  if (e.target.id === 'drawer') { closeSettings(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case 'step': go(d.step); break;
    case 'prev': go(stepOffset(-1)); break;
    case 'next': go(stepOffset(1)); break;
    case 'present': ui.present = !ui.present; scheduleRender(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'sound': ui.sound = !ui.sound; ls.set('kc-sound', ui.sound); if (ui.sound) chime([880], 0.12); scheduleRender(); break;
    case 'settings': openSettings(); break;
    case 'settings-close': closeSettings(); break;
    case 'kid-del': deleteKid(d.id); break;
    case 'teacher-del': deleteTeacher(d.id); break;
    case 'sample-fill': sampleFill(); break;
    case 'sample-clear': if (confirmTwice(el, 'sample-clear', '한 번 더 누르면 지워요')) sampleClear(); break;
    case 'form-teams': doFormTeams(false); break;
    case 'reroll': if (confirmTwice(el, 'reroll', '한 번 더 누르면 다시 섞어요')) doFormTeams(true); break;
    case 'kid-pick': if (!ui.present && !readOnly) { ui.moveKid = ui.moveKid === d.id ? null : d.id; scheduleRender(); } break;
    case 'move-here': moveKid(ui.moveKid, Number(d.team)); break;
    case 'assign-rest': assignRest(); break;
    case 'timer-start': timerStart(d.key); break;
    case 'timer-pause': timerPause(); break;
    case 'timer-reset': timerReset(d.key); break;
    case 'timer-plus': timerPlus(d.key); break;
    case 'timer-toggle': if (!timerToggleCurrent()) toast('이 단계에는 타이머가 없어요'); break;
    case 'rps-add': rpsAdd(Number(d.team)); break;
    case 'rps-undo': rpsUndo(); break;
    case 'rps-reset': if (confirmTwice(el, 'rps-reset', '한 번 더 누르면 처음부터')) writeState({rps: [], picks: []}); break;
    case 'pick': doPick(d.name); break;
    case 'pick-undo': pickUndo(); break;
    case 'pick-skip': doPick(null); break;
    case 'vote-open': writeState({voting: {open: true, openedAt: Date.now()}}); break;
    case 'vote-close': writeState({voting: {open: false, closedAt: Date.now()}}); break;
    case 'code-read': { const ta = $('#code-input'); ui.pastePreview = decodeBallot(ta ? ta.value : '') || {error: true}; scheduleRender(); break; }
    case 'code-save': codeSave(); break;
    case 'reveal-next': revealMove(1); break;
    case 'reveal-prev': revealMove(-1); break;
    case 'toggle-scores': ui.showScores = !ui.showScores; scheduleRender(); break;
    case 'hide': toggleHide(d.key); break;
    case 'copy-winners': copyText(winnersText()); break;
    case 'toggle-allc': ui.showAllComments = !ui.showAllComments; scheduleRender(); break;
    case 'reset': if (confirmTwice(el, 'reset-' + d.what, '한 번 더 누르면 초기화')) doReset(d.what); break;
    case 'go-ops': ui.forceOperator = true; setHash('ops'); break;
    case 'go-vote': if (IN_CLAUDE) setHash('vote'); else { const w = window.open(voteLink(), '_blank'); if (!w) location.href = voteLink(); } break;
    case 'copy-link': copyText(voteLink()); break;
    case 'vteam': ui.vteam = Number(d.team); ls.set('kc-team', ui.vteam); built = null; scheduleRender(); window.scrollTo(0, 0); break;
    case 'vteam-change': ui.vteam = null; ls.set('kc-team', null); built = null; scheduleRender(); break;
    case 'rank': setRank(Number(d.team), Number(d.rank)); break;
    case 'vote-submit': submitVote(Number(ui.vteam)); break;
    case 'canape-save': saveCanape(Number(ui.vteam)); break;
    case 'copy-code': copyText(ui.codeShown || ui.codeOut); break;
    case 'undo': if (ui.undo) { const f = ui.undo; ui.undo = null; f(); $('#toast').className = 'toast'; } break;
  }
});

function submitForm(kind) {
  if (kind === 'kid') addKidFromForm();
  else if (kind === 'teacher') addTeacherFromForm();
  else if (kind === 'manual') manualSave();
  else if (kind === 'config') saveConfig();
}
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  submitForm(f.dataset.form);
});

// Korean IME: Enter while a syllable is still composing must finish the syllable first, then submit once.
const ENTER_FIELDS = '#kid-name, #kid-allergy, #teacher-name';
let pendingEnter = null, lastCompEnd = 0;
document.addEventListener('compositionend', e => {
  lastCompEnd = Date.now();
  if (pendingEnter && e.target.matches && e.target.matches(ENTER_FIELDS) && Date.now() - pendingEnter.t < 600) {
    const f = pendingEnter.f;
    pendingEnter = null;
    setTimeout(() => submitForm(f), 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches(ENTER_FIELDS)) {
    e.preventDefault();
    const f = e.target.closest('[data-form]').dataset.form;
    if (e.isComposing) { pendingEnter = {f: f, t: Date.now()}; return; }
    if (e.keyCode === 229 && Date.now() - lastCompEnd > 120) { pendingEnter = {f: f, t: Date.now()}; return; }
    submitForm(f);
    return;
  }
  if (e.key === 'Escape') {
    if (ui.settingsOpen) closeSettings();
    else if (ui.moveKid) { ui.moveKid = null; scheduleRender(); }
    else if (ui.present) { ui.present = false; scheduleRender(); }
    return;
  }
  if (currentMode() !== 'operator' || ui.settingsOpen) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(stepOffset(1)); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(stepOffset(-1)); }
  else if (e.code === 'Space') { if (!readOnly && timerToggleCurrent()) e.preventDefault(); }
  else if (e.code === 'KeyP') { ui.present = !ui.present; scheduleRender(); }
  else if (e.code === 'KeyF') toggleFullscreen();
});
document.addEventListener('input', e => {
  if (currentMode() !== 'vote' || !e.target.matches) return;
  if (e.target.matches('#vote-sec textarea, #canape-name')) {
    clearTimeout(ui.draftT);
    const t = Number(ui.vteam);
    ui.draftT = setTimeout(() => saveVoteDraft(t), 300);
    if (e.target.matches('textarea')) updateVoteDynamic(t);
  }
});
document.addEventListener('pointerdown', () => { if (currentMode() === 'operator' && ui.sound) audio(); }, {passive: true});
const BOOT_KIND = location.hash.indexOf('#vote') === 0 ? 'vote' : 'host';
window.addEventListener('hashchange', () => {
  // Outside Claude the page sets itself up as either the laptop or a phone, so switching needs a fresh start.
  if (!IN_CLAUDE && (location.hash.indexOf('#vote') === 0 ? 'vote' : 'host') !== BOOT_KIND) { location.reload(); return; }
  built = null; scheduleRender();
});
if (window.matchMedia) {
  const mq = window.matchMedia('(max-width: 700px)');
  const onMq = () => { if (location.hash !== '#vote' && location.hash !== '#ops' && !ui.forceOperator) { built = null; scheduleRender(); } };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
}

/* ---------- start ---------- */
render();
setInterval(updateTimers, 200);
loadQr();
connect();
})();
</script>

</body>
